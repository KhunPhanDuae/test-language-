<!DOCTYPE html>
<html lang="blk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pa'O Sentence Collector Tool</title>
        <link rel="icon" type="png" href="image/pao_digital_hub_logo.png">
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            color: #007bff;
            text-align: center;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            margin-top: 15px;
        }
        .flex-row {
            display: flex;
            gap: 10px;
        }
        .flex-row > div {
            flex: 1;
        }
        input[type="text"], textarea, select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            background-color: #fff;
        }
        /* ID ရှာဖွေသည့် Input Box အတွက် ပုံစံသစ် */
        .search-input {
            margin-bottom: 8px;
            border: 1px solid #007bff;
            background-color: #f0f7ff;
        }
        textarea {
            height: 100px;
            resize: vertical;
        }
        .btn-group {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-add { background-color: #28a745; color: white; }
        .btn-clear { background-color: #dc3545; color: white; }
        .btn-sheet { background-color: #0f9d58; color: white; }
        .btn-json { background-color: #6f42c1; color: white; }
        
        button:disabled {
            background-color: #cccccc !important;
            cursor: not-allowed;
        }

        .counter {
            margin-top: 15px;
            font-weight: bold;
            text-align: right;
            color: #555;
        }
        .preview-box {
            margin-top: 20px;
            background: #e9ecef;
            padding: 10px;
            border-radius: 4px;
            max-height: 250px;
            overflow-y: auto;
            font-size: 14px;
        }
        
        #previewList {
            padding-left: 20px;
            margin: 5px 0;
        }
        #previewList li {
            margin-bottom: 8px;
            padding: 4px;
            border-radius: 4px;
            transition: background 0.3s;
        }
        
        .li-container {
            display: table;
            width: 100%;
        }
        .text-cell {
            display: table-cell;
            vertical-align: middle;
            word-break: break-all;
        }
        .btn-cell {
            display: table-cell;
            vertical-align: middle;
            text-align: right;
            width: 70px;
            padding-left: 10px;
        }
        
        .btn-delete-item {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: normal;
        }
        .btn-delete-item:hover {
            background-color: #c82333;
        }

        .duplicate-highlight {
            background-color: #f8d7da !important;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }

        .alert-box {
            margin-top: 15px;
            padding: 10px 15px;
            border-radius: 4px;
            display: none;
            font-size: 14px;
        }
        .alert-warning {
            background-color: #fff3cd;
            border-left: 5px solid #ffc107;
            color: #856404;
        }
        .alert-danger {
            background-color: #f8d7da;
            border-left: 5px solid #dc3545;
            color: #721c24;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Pa'O Digital Hub  - Pa'O Sentence Collector</h2>
    
    <div class="flex-row">
        <div>
            <label for="author">တဲမ်းလိတ်သား မဉ်ꩻ :</label>
            <input type="text" id="author" placeholder="တဲမ်းသော့ꩻမဉ်ꩻ" oninput="validateUserRealtime()">
        </div>
        <div>
            <label for="userId">အမုဲင်နံပတ် / လွိုက်ထူႏ ID :</label>
            <input type="text" id="searchId" class="search-input" placeholder="🔍 ထိုမ်ႏထွား ID..." oninput="filterIDs()">
            
            <select id="userId" onchange="validateUserRealtime()">
                <option value="">--လွိုက်ထူႏသွော့ꩻ ID --</option>
            </select>
        </div>
    </div>

    <div id="userVerificationAlert" class="alert-box alert-danger"></div>

    <label for="sentence">တဲမ်းသော့ꩻ ပအိုဝ်ႏလိတ်ရဲဉ်းဟုဲင်း (တလဲင်ႏရဲဉ်ႏစီႏ) :</label>
    <textarea id="sentence" placeholder="မင်္ဂလာႏဒျာႏဩ...  (မိဉ်ႏထွူ နျꩻသွော့ꩻ Add နောဝ်ꩻတဝ်းလဲ့ Enter ဩ)"></textarea>
    
    <div id="dbDuplicateAlert" class="alert-box alert-warning"></div>

    <div class="btn-group">
        <button class="btn-add" onclick="addSentence()">Add </button>
        <button class="btn-clear" onclick="clearAll()">Clear </button>
    </div>

    <div class="counter">လိတ်ရဲဉ်ႏ စုခွဉ်းဗူႏ: <span id="count">0</span> / 5000</div>

    <div class="preview-box">
        <label>အွဉ်ႏဟောဝ်ခါꩻဒါႏ လိတ်ရဲဉ်ႏနောဝ်ꩻခါဖုံႏ review:</label>
        <ol id="previewList"></ol>
    </div>

    <div class="btn-group" style="margin-top: 20px;">
        <button id="btnSheet" class="btn-sheet" onclick="uploadToSheet()">ဒင်ႏပသာထင်ႏ</button>
        <button class="btn-json" onclick="downloadJSON()">ထူႏထေ .JSON</button>
    </div>
</div>

<script>
    let sentences = [];
    let registeredUsers = []; 
    let cachedDbData = []; 
    let isUserVerified = false; 
    let currentInputHasDbDuplicate = false; 
    let dbDuplicateSentencesList = []; 

    // 🔴 ခွန်ဖန်ဒွဲ့၏ Google Apps Script URL အသစ်
    const GOOGLE_SCRIPT_API_URL = "https://script.google.com/macros/s/AKfycbzrEOPfr0a0V1rEMQMUxgusFurDQww4dCyA44eqSrmpNSkbD3mna4shiSHWCpdDDSZb/exec";

    window.onload = function() {
        loadRegisteredUsersAndData();
    };

    // Database မှ User များနှင့် P1 ဒေတာများကို တစ်ခါတည်း ဆွဲယူဖတ်ရှုခြင်း
    function loadRegisteredUsersAndData() {
        fetch(GOOGLE_SCRIPT_API_URL)
            .then(res => res.json())
            .then(result => {
                if(result.status === "success") {
                    cachedDbData = Array.isArray(result.p1Data) ? result.p1Data : [];
                    registeredUsers = Array.isArray(result.users) ? result.users : [];
                    
                    populateIDDropdown(registeredUsers);
                }
            })
            .catch(err => console.error("Error loading data from Google Sheets:", err));
    }

    // Dropdown ထဲသို့ ID များ စတင်ထည့်သွင်းခြင်း
    function populateIDDropdown(users) {
        filterIDs(); 
    }

    // 🔍 ID များကို ရိုက်ရှာပြီး Real-time Filter လုပ်ပေးမည့် Function
    function filterIDs() {
        let select = document.getElementById('userId');
        let searchQuery = document.getElementById('searchId').value.trim().toLowerCase();
        
        select.innerHTML = '<option value="">-- လွိုက်ထူႏ ID --</option>';
        
        // PAO_USERS ထဲရှိ USERID များကို ထပ်နေတာဖယ်ပြီး စီရန်
        let ids = [...new Set(registeredUsers.map(u => String(u.USERID)).filter(id => id && id.trim() !== ""))];
        ids.sort((a, b) => a - b);
        
        let filteredIds = ids.filter(id => id.toLowerCase().includes(searchQuery));
        
        filteredIds.forEach(id => {
            let option = document.createElement('option');
            option.value = id;
            option.text = id;
            select.appendChild(option);
        });

        validateUserRealtime();
    }

    // တဲမ်းလိတ်သား အမည်နှင့် ID မှန်ကန်မှုရှိမရှိ စစ်ဆေးခြင်း
    function validateUserRealtime() {
        let name = document.getElementById('author').value.trim();
        let id = document.getElementById('userId').value;
        let alertBox = document.getElementById('userVerificationAlert');

        if (name === "" || id === "") {
            alertBox.style.display = "none";
            isUserVerified = false;
            return;
        }

        let match = registeredUsers.find(u => String(u.AUTHOR).toLowerCase() === name.toLowerCase() && String(u.USERID) === id);

        if (match) {
            alertBox.style.display = "none";
            isUserVerified = true;
        } else {
            alertBox.innerHTML = "❌ <strong>ဖေႏသေဗာႏ</strong> ကလွိုက်ထူႏဒါႏ မဉ်ꩻတွမ်ႏID မဲန်ႏတနꩻတောဝ်းသွူဩ။ မိဉ်ႏတဒင်ႏသွင်ꩻဗာႏဒွိုန်းမဉ်ꩻလဲ့ ဩဗွေႏ ဒင်ႏသွင်ꩻဖေႏသွော့ꩻ မဉ်ꩻဟုဲင်းဩ။";
            alertBox.style.display = "block";
            isUserVerified = false;
        }
    }

    document.getElementById('sentence').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            addSentence();
        }
    });

    let searchTimeout;
    document.getElementById('sentence').addEventListener('input', function() {
        clearTimeout(searchTimeout);
        let text = this.value.trim().replace(/\s+/g, ' ');
        
        if (text.length > 3) {
            searchTimeout = setTimeout(() => {
                checkDuplicateInDatabase(text);
            }, 300);
        } else {
            hideDuplicateAlert();
            currentInputHasDbDuplicate = false;
        }
    });

    // ဒေတာဘေ့စ် (P1) ထဲတွင် စာသားထပ်နေခြင်း ရှိမရှိ Local cache ထဲမှ အမြန်စစ်ဆေးခြင်း
    function checkDuplicateInDatabase(text) {
        let duplicates = cachedDbData.filter(item => item.PAOTEXT && item.PAOTEXT.trim() === text);
        
        if (duplicates.length > 0) {
            let alertBox = document.getElementById('dbDuplicateAlert');
            let duplicateDetails = duplicates.map(item => {
                return `<br>• တဲမ်းသား: <strong>${item.AUTHOR || 'သေတောဝ်း အမဉ်ꩻ'}</strong> (ID: <strong>${item.USERID || 'အောဝ်ႏတောဝ်း'}</strong>)`;
            }).join('');
            
            alertBox.innerHTML = `⚠️ <strong>ဖေႏသေဗာႏ:</strong> လိတ်ရဲဉ်ႏယိုနောဝ်ꩻ အောဝ်ႏထွူလဲဉ်းဒျာႏတဲင် ဒင်ႏသော့ꩻလꩻတောဝ်းသွူ ${duplicateDetails}`;
            alertBox.style.display = "block";
            currentInputHasDbDuplicate = true; 
        } else {
            hideDuplicateAlert();
            currentInputHasDbDuplicate = false;
        }
    }

    function hideDuplicateAlert() {
        let alertBox = document.getElementById('dbDuplicateAlert');
        alertBox.innerHTML = "";
        alertBox.style.display = "none";
    }

    function addSentence() {
        let authorInput = document.getElementById('author');
        let userIdSelect = document.getElementById('userId');
        let sentenceInput = document.getElementById('sentence');
        
        let authorName = authorInput.value.trim();
        let userId = userIdSelect.value;
        let text = sentenceInput.value.trim().replace(/\s+/g, ' '); 

        if (!isUserVerified) {
            alert("တဲမ်းလိတ်သား အမဉ်ꩻတွမ်ႏ ID မဲန်ႏတနꩻတောဝ်းတဲင် ဒင်ႏသော့ꩻ လိတ်ရဲဉ်ႏ လꩻတောဝ်းသွူဩ။");
            authorInput.focus();
            return;
        }

        if (text === "") {
            alert("တဲမ်းသော့ꩻ ရီးသွော့ꩻ လိတ်ယာႏ တဗာႏဗာႏ။");
            sentenceInput.focus();
            return;
        }

        if (/[\d၀-၉]/.test(text)) {
            alert("ဖေႏသေဗာႏ: လိတ်ရဲဉ်ႏအကို ဂဏန်ꩻပါလꩻတောဝ်း နောဝ်ꩻမꩻ တဲမ်းဖေႏငါ လိတ်ယာႏဩ။");
            return;
        }

        if (currentInputHasDbDuplicate) {
            alert("လိတ်ရဲဉ်ႏယိုနောဝ်ꩻ အောဝ်ႏထွူလဲဉ်းတဲင် ဒင်ႏထဲင်းလꩻတောဝ်းသွူဩ။");
            return;
        }

        let isDuplicateInPreview = sentences.some(item => item.text === text);
        if (isDuplicateInPreview) {
            alert("ဖေႏသေဗာႏ: လိတ်ရဲဉ်ႏယိုနောဝ်ꩻ ဆꩻလ Preview စာႏရင်ꩻကို ပါသော့ꩻထွူလဲဉ်းဒျာႏဩ။");
            return;
        }

        sentences.push({
            text: text,
            author: authorName,
            userId: userId
        });

        sentenceInput.value = ""; 
        hideDuplicateAlert();
        currentInputHasDbDuplicate = false;
        sentenceInput.focus();
        updateUI();
    }

    function updateUI() {
        document.getElementById('count').innerText = sentences.length;
        let list = document.getElementById('previewList');
        list.innerHTML = "";
        
        sentences.forEach(function(item, index) {
            let li = document.createElement('li');
            
            if (dbDuplicateSentencesList.includes(item.text)) {
                li.className = "duplicate-highlight";
            }
            
            let container = document.createElement('div');
            container.className = "li-container";
            
            let textCell = document.createElement('div');
            textCell.className = "text-cell";
            textCell.innerText = item.text;
            
            let btnCell = document.createElement('div');
            btnCell.className = "btn-cell";
            
            let deleteBtn = document.createElement('button');
            deleteBtn.className = "btn-delete-item";
            deleteBtn.innerText = "ယားထိုꩻ";
            deleteBtn.onclick = function() {
                deleteSentenceByIndex(index, item.text);
            };
            
            btnCell.appendChild(deleteBtn);
            container.appendChild(textCell);
            container.appendChild(btnCell);
            li.appendChild(container);
            list.appendChild(li);
        });
        
        let box = document.querySelector('.preview-box');
        if (dbDuplicateSentencesList.length === 0) {
            box.scrollTop = box.scrollHeight;
        }
    }

    function deleteSentenceByIndex(index, text) {
        sentences.splice(index, 1);
        let dupIdx = dbDuplicateSentencesList.indexOf(text);
        if (dupIdx > -1) {
            dbDuplicateSentencesList.splice(dupIdx, 1);
        }
        updateUI();
    }

    function clearAll() {
        if (confirm("ကားတဲင် ကတဲမ်းရွမ်ဆꩻလꩻယို ယားထိုꩻနောဝ်ꩻ စဲင်းစဲ့ဒျာႏနဲ့?")) {
            sentences = [];
            dbDuplicateSentencesList = [];
            hideDuplicateAlert();
            currentInputHasDbDuplicate = false;
            updateUI();
        }
    }

    function getCurrentFormattedDateTime() {
        let now = new Date();
        let year = now.getFullYear();
        let month = String(now.getMonth() + 1).padStart(2, '0');
        let day = String(now.getDate()).padStart(2, '0');
        let hours = String(now.getHours()).padStart(2, '0');
        let minutes = String(now.getMinutes()).padStart(2, '0');
        let seconds = String(now.getSeconds()).padStart(2, '0');
        
        return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
    }

    // ဒေတာများကို Google Apps Script မှတစ်ဆင့် Google Sheet သို့ ပို့ပေးခြင်း
    async function uploadToSheet() {
        if (sentences.length === 0) {
            alert("အီႏဒင်ႏထင်ႏ ပအိုဝ်ႏငေါဝ်းတာႏ လိတ်ရဲဉ်ႏ အောဝ်ႏတောဝ်းဒွိုန်းဩ"); return;
        }

        let btn = document.getElementById('btnSheet');
        btn.disabled = true;
        btn.innerText = "အောဝ်ႏစဲစ်ထွားလိတ်ယာႏ...";
        
        dbDuplicateSentencesList = [];

        try {
            // လတ်တလော Sheet ထဲက ဒေတာအခြေအနေကို နောက်ဆုံးတစ်ခေါက် ထပ်မံစစ်ဆေးခြင်း
            let responseAll = await fetch(GOOGLE_SCRIPT_API_URL);
            let result = await responseAll.json();
            
            let dbSentences = (result.status === "success" && Array.isArray(result.p1Data)) ? result.p1Data.map(item => item.PAOTEXT ? item.PAOTEXT.trim() : "") : [];
            
            for (let item of sentences) {
                if (dbSentences.includes(item.text)) {
                    dbDuplicateSentencesList.push(item.text);
                }
            }

            if (dbDuplicateSentencesList.length > 0) {
                updateUI();
                alert(`❌ ဒင်ႏထင်ႏလꩻတောဝ်း! လိတ်ရဲဉ်ႏ Preview အကို(${dbDuplicateSentencesList.length}) ရဲဉ်ႏဖုံႏယိုနောဝ်ꩻ အောဝ်ႏထွူလဲဉ်းသွူ။\n\nလိတ်ရဲဉ်ႏနောဝ်ꩻဖုံႏယို အွဉ်ႏနယ်ဖေႏ အရောင်ႏတနျာႏသွူ ယားထိုꩻ လဲင်ႏတရဲဉ်ႏထွူ ဒင်ႏထင်ႏချာယင်း လꩻဒျာႏဩ။`);
                btn.disabled = false;
                btn.innerText = "ဒင်ႏပသာထင်ႏ";
                return; 
            }

            let submissionTimestamp = getCurrentFormattedDateTime();
            btn.innerText = "အောဝ်ႏပသာတွင်ꩻ...";

            let successCount = 0;
            for (let item of sentences) {
                let payload = {
                    "PAOTEXT": item.text,
                    "AUTHOR": item.author,
                    "USERID": item.userId,
                    "DATE": submissionTimestamp
                };

                await fetch(GOOGLE_SCRIPT_API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                successCount++;
            }

            alert(`တွိုႏဗꩻလဲဉ်း! လိတ်ရဲဉ်ႏ (${successCount}) သော့ꩻထွူလဲဉ်း`);
            sentences = []; 
            dbDuplicateSentencesList = [];
            updateUI();
            
            // ဒေတာအသစ်များအားလုံးကို local database cache တွင် ပြန်လည်မွမ်းမံရန်
            loadRegisteredUsersAndData();

        } catch (error) {
            console.error('Error:', error);
            alert("အောဝ်ႏထွားစဲစ် လိတ်ယာႏတွင်ꩻ အဲဉ်တာနဲစ်လဲင်းဟောဝ်းတောဝ်း");
        } finally {
            btn.disabled = false;
            btn.innerText = "ဒင်ႏပသာထင်ႏ";
        }
    }

    function downloadJSON() {
        if (sentences.length === 0) return alert("ထူႏထေတာႏ လိတ်ယာႏအဲဉ်ထဝ်း");
        
        let jsonFormat = sentences.map(item => ({
            PAOTEXT: item.text,
            AUTHOR: item.author,
            USERID: item.userId,
            DATE: getCurrentFormattedDateTime(),
            source: "KhunPhanDuae - Pa'O Digital Hub"
        }));

        let jsonContent = JSON.stringify(jsonFormat, null, 2);
        let blob = new Blob([jsonContent], { type: "application/json;charset=utf-8" });
        
        let link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "pao_sentences_backup.json";
        link.click();
        URL.revokeObjectURL(link.href);
    }
</script>

</body>
</html>
