name: Pa'O Digital Hub Update

on:
  # Google Sheet data ကို တစ်နာရီတစ်ကြိမ် စစ်မည်
  schedule:
    - cron: '0 * * * *'
  
  # GitHub Actions မှ manual run လုပ်နိုင်ရန်
  workflow_dispatch:

# GitHub Actions က index.html ကို commit/push လုပ်ခွင့်
permissions:
  contents: write

jobs:
  build:
    name: Update Dataset Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show Environment
        run: |
          echo "Node version:"
          node --version
          echo "Git version:"
          git --version
          echo "Current branch:"
          git branch --show-current

      - name: Run Build Script
        run: |
          echo "Running build.js..."
          node build.js

      - name: Check Generated HTML
        run: |
          echo ""
          echo "===== Generated HTML Check ====="
          echo ""
          echo "--- Statistics ---"
          sed -n '/<!-- STATS_START -->/,/<!-- STATS_END -->/p' index.html
          echo ""
          echo "--- Dataset Count ---"
          echo "Dataset cards:"
          grep -c '<article class="card"' index.html || true
          echo ""
          echo "--- File Information ---"
          ls -lh index.html
          echo ""
          echo "================================"

      - name: Commit and Push Updated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes detected."
            echo "index.html already contains the latest data."
          else
            echo "Changes detected."
            git diff --cached --stat
            git commit -m "Auto update dataset HTML"
            git push
            echo "✅ index.html pushed successfully."
          fi
