<!DOCTYPE html>
<html lang="my">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pa'O Smart Voice Engine</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 520px;
            margin: 30px auto;
            padding: 20px;
            background: #f5f5f5;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 12px 20px;
            margin: 15px 5px;
            background: #0066ff;
            color: white;
            border: 0;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            background: #aaa;
        }

        #status {
            margin-top: 10px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>

<body>

    <h2>Pa'O Smart Audio Reader</h2>

    <input id="text" placeholder="စာရိုက်ပါ">
    <button id="playBtn" onclick="playText()">အသံဖတ်ရန်</button>

    <div id="status">စနစ်ပြင်ဆင်နေသည်...</div>

    <script>
        const audioPath = "https://raw.githubusercontent.com/KhunPhanDuae/test-language-/main/audio/";
        let audioFiles = [];
        let audioCache = new Map();
        let ctx;

        // ၁။ Audio Folder Index ကို ယူမည်
        async function loadAudioIndex() {
            let status = document.getElementById("status");
            let api = "https://api.github.com/repos/KhunPhanDuae/test-language-/contents/audio";

            try {
                let res = await fetch(api);
                if (!res.ok) throw new Error("API Limit သို့မဟုတ် Folder မတွေ့ပါ");

                let data = await res.json();

                // ဖိုင်အမည်များကို ယူပြီး စာလုံးအရှည်ဆုံး အစီအစဉ်အတိုင်း Sort လုပ်ထားမည်
                audioFiles = data
                    .filter(x => x.name.match(/\.(wav|mp3|m4a)$/i))
                    .map(x => x.name.replace(/\.(wav|mp3|m4a)$/i, ""))
                    .sort((a, b) => b.length - a.length); // အရှည်ဆုံး စကားလုံးများ အရင်လာမည်

                status.innerText = "အသင့်ဖြစ်ပါပြီ";
            } catch (e) {
                console.error(e);
                status.innerText = "အသံဖိုင် စာရင်းယူ၍မရပါ (Offline/Limit Error)";
            }
        }

        loadAudioIndex();

        // ၂။ စာသားကို အသံထွက်ဖတ်မည်
        async function playText() {
            let text = document.getElementById("text").value.trim();
            let status = document.getElementById("status");

            if (!text) return;

            // AudioContext အား စတင်ပေးခြင်း/ဆိုင်းငံ့ထားမှု နိုးဆွခြင်း
            if (!ctx) {
                ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (ctx.state === "suspended") {
                await ctx.resume();
            }

            status.innerText = "ရှာဖွေနေသည်...";

            let words = smartSplit(text);
            let buffers = [];

            for (let word of words) {
                let audio = await getAudio(word);
                if (audio) {
                    buffers.push(audio);
                }
            }

            if (buffers.length === 0) {
                status.innerText = "အသံဖိုင် မတွေ့ပါ";
                return;
            }

            status.innerText = "ဖွင့်နေသည်...";

            let time = ctx.currentTime;

            buffers.forEach(buffer => {
                let source = ctx.createBufferSource();
                source.buffer = buffer;
                source.connect(ctx.destination);
                source.start(time);
                time += buffer.duration; // အသံဖိုင်တစ်ခုပြီးမှ တစ်ခု ဆက်တိုက်ပွင့်မည်
            });

            // အသံဖွင့်ပြီးပါက Status ပြောင်းရန်
            let totalDuration = (time - ctx.currentTime) * 1000;
            setTimeout(() => {
                status.innerText = "အသင့်ဖြစ်ပါပြီ";
            }, totalDuration);
        }

        // ၃။ Smart Split (စာသားခွဲထုတ်စနစ်)
        function smartSplit(text) {
            let result = [];

            while (text.length > 0) {
                let found = "";

                for (let f of audioFiles) {
                    if (text.startsWith(f)) {
                        found = f;
                        break; // audioFiles သည် အရှည်ဆုံးမှ အတိုသို့ Sort လုပ်ထားပြီးဖြစ်၍ ပထမတွေ့သည်မှာ အရှည်ဆုံးဖြစ်သည်
                    }
                }

                if (found) {
                    result.push(found);
                    text = text.substring(found.length);
                } else {
                    let char = text[0];
                    result.push(char);
                    text = text.substring(1);
                }
            }

            return result;
        }

        // ၄။ အသံဖိုင် Fetch/Decode လုပ်မည်
        async function getAudio(name) {
            for (let ext of [".wav", ".mp3", ".m4a"]) {
                let url = audioPath + encodeURIComponent(name) + ext;

                if (audioCache.has(url)) {
                    return audioCache.get(url);
                }

                try {
                    let res = await fetch(url);
                    if (res.ok) {
                        let data = await res.arrayBuffer();
                        let buffer = await ctx.decodeAudioData(data);
                        audioCache.set(url, buffer);
                        return buffer;
                    }
                } catch (e) {
                    // သက်ဆိုင်ရာ extension မတွေ့ပါက နောက်တစ်မျိုး စမ်းမည်
                }
            }
            return null;
        }
    </script>

</body>

</html>
